<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FridgeChef - Generátor receptov podľa surovín, ktoré máš doma v chladničke">
    <title>🍳 FridgeChef - Generátor receptov</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- Animované pozadie -->
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1 class="logo">
                <span class="logo-icon">🍳</span>
                <span class="logo-text">FridgeChef</span>
            </h1>
            <p class="tagline">Zisti, čo si môžeš uvariť z toho, čo máš v chladničke</p>
        </header>

        <!-- Input sekcia -->
        <section class="input-section glass-card">
            <div class="input-wrapper">
                <span class="input-icon">🥕</span>
                <input
                    type="text"
                    id="ingredientInput"
                    class="ingredient-input"
                    placeholder="Zadaj surovinu (napr. vajcia)..."
                    autocomplete="off"
                    maxlength="30"
                >
                <button id="addBtn" class="btn btn-add" aria-label="Pridať surovinu">
                    <span>+ Pridať</span>
                </button>
            </div>

            <!-- Validačná správa -->
            <div id="validationMsg" class="validation-msg" role="alert"></div>

            <!-- Tagy surovín -->
            <div id="tagsContainer" class="tags-container" aria-label="Zoznam pridaných surovín">
                <p class="tags-placeholder">Zatiaľ žiadne suroviny — pridaj nejaké! 👆</p>
            </div>

            <!-- Akčné tlačidlá -->
            <div class="action-buttons">
                <button id="findBtn" class="btn btn-primary">
                    <span>🔍 Nájdi recepty</span>
                </button>
                <button id="randomBtn" class="btn btn-secondary">
                    <span>🎲 Náhodný recept</span>
                </button>
                <button id="clearBtn" class="btn btn-clear" title="Vymaž všetky suroviny">
                    <span>🗑️ Vyčistiť</span>
                </button>
            </div>
        </section>

        <!-- Výsledky -->
        <section class="results-section">
            <div id="resultsHeader" class="results-header" style="display:none;">
                <h2 id="resultsTitle">📋 Nájdené recepty</h2>
            </div>
            <div id="recipesGrid" class="recipes-grid"></div>
            <div id="emptyState" class="empty-state" style="display:none;">
                <span class="empty-icon">🤷‍♂️</span>
                <h3>Žiadne vhodné recepty</h3>
                <p>Skús pridať viac surovín alebo klikni na <strong>Náhodný recept</strong></p>
            </div>
        </section>

        <footer class="footer">
            <p>Vytvorené s ❤️ a AI · FridgeChef &copy; 2025</p>
        </footer>
    </div>

    <!-- Modálne okno -->
    <div id="modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="modal-backdrop"></div>
        <div class="modal-content glass-card">
            <button id="modalClose" class="modal-close" aria-label="Zatvoriť">✕</button>
            <div id="modalBody" class="modal-body"></div>
        </div>
    </div>

    <!-- Toast notifikácie -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="assets/js/script.js"></script>
</body>
</html>
